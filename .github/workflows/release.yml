name: Release

# Pushing a v* tag stages that version on npm through trusted publishing (OIDC, no token).
# A maintainer approves it with 2FA: npx npm@11.21.1 stage approve <stage-id>.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.15.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 and staging 11.15.0; Node 22 ships npm 10.
      - name: Install npm
        run: npm install -g npm@11.21.1

      - name: Check the tag matches package.json
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run bin/ci
        run: bin/ci

      - name: Stage on npm
        run: npm stage publish
